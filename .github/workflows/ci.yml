name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: [stable]
        include:
          - os: ubuntu-latest
            go: oldstable
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Static analysis
        run: go vet ./...
      - name: Tests with race detector and coverage
        run: go test -race -count=1 -timeout=5m -coverpkg=./... -coverprofile=coverage.out -json ./... | tee test-results.json
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.out ]; then
            go tool cover -func=coverage.out | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.os }}-${{ matrix.go }}
          path: |
            coverage.out
            test-results.json
          retention-days: 14

  security:
    name: Fuzz and vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false
      - name: Fuzz legacy parser and transactional output
        run: go test ./stream -run='^$' -fuzz=FuzzDecryptV1 -fuzztime=30s -parallel=2
      - name: Fuzz envelope parser
        run: go test ./envelope -run='^$' -fuzz=FuzzOpen -fuzztime=30s -parallel=2
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
      - name: Lint
        run: $(go env GOPATH)/bin/golangci-lint run
      - name: Check reachable vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Preserve failing fuzz inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-failures
          path: |
            stream/testdata/fuzz/
            envelope/testdata/fuzz/
          if-no-files-found: ignore
