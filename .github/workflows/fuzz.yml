name: Extended fuzzing

on:
  schedule:
    - cron: '17 3 * * 6' # weekly, Saturday 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}
  cancel-in-progress: true

# Longer, bounded campaigns for the security-critical parsers. The short PR
# smoke fuzz in ci.yml stays fast; this job runs materially longer on a schedule
# or on demand.
jobs:
  fuzz:
    name: Fuzz ${{ matrix.target.fuzz }} (${{ matrix.target.time }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - { package: ./stream, fuzz: FuzzDecryptV1, time: 600s }
          - { package: ./stream, fuzz: FuzzDecryptV2, time: 600s }
          - { package: ./aead, fuzz: FuzzOpen, time: 600s }
          - { package: ./aead, fuzz: FuzzSealOpen, time: 600s }
          - { package: ./envelope, fuzz: FuzzOpen, time: 600s }
          - { package: ./identity/credentials, fuzz: FuzzDecode, time: 600s }
          - { package: ./identity/devices, fuzz: FuzzDecodeRecord, time: 600s }
          - { package: ./identity/devices, fuzz: FuzzDecodeRevocation, time: 600s }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false

      - name: Run fuzz target
        run: |
          go test "${{ matrix.target.package }}" \
            -run='^$' \
            -fuzz="${{ matrix.target.fuzz }}" \
            -fuzztime="${{ matrix.target.time }}" \
            -parallel=2

      - name: Preserve failing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-failures-${{ matrix.target.fuzz }}
          path: |
            stream/testdata/fuzz/
            aead/testdata/fuzz/
            envelope/testdata/fuzz/
            identity/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 30
